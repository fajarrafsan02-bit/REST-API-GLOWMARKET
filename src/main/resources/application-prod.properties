# ============================================================
# PROFIL PROD
# Aktifkan dengan: SPRING_PROFILES_ACTIVE=prod
# Seluruh kredensial diambil dari environment variable.
# ============================================================

spring.jpa.show-sql=false

# Swagger tertutup sepenuhnya di produksi
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
app.swagger.public=false

logging.level.root=WARN
logging.level.org.springdoc=WARN
logging.level.com.projekfajar=INFO
# Produksi menulis ke berkas dengan rotasi supaya jejak error tidak hilang
# begitu proses di-restart, dan tidak menghabiskan disk.
logging.file.name=${LOG_FILE:logs/projek-fajar.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
# Ambang "SLOW" dinaikkan di produksi supaya tidak bising oleh lonjakan wajar.
app.logging.slow-call-ms=${LOG_SLOW_CALL_MS:2000}

# Migrasi tetap dijalankan, tetapi tidak boleh membuat baseline sendiri:
# database produksi harus sudah tercatat versinya secara sadar.
spring.flyway.baseline-on-migrate=false

# ============================================================
# KOLAM KONEKSI
# ============================================================
# Postgres terkelola berbagi kuota koneksi untuk seluruh proyek, dan paket
# gratis biasanya hanya memberi puluhan koneksi. Kolam bawaan Hikari (10)
# dikali beberapa instance sudah cukup untuk menghabiskannya, sehingga
# batasnya diturunkan dan koneksi menganggur dilepas lebih cepat.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=120000
# Penyedia terkelola memutus koneksi menganggur secara sepihak. Daur ulang
# koneksi harus lebih cepat daripada pemutusan itu agar aplikasi tidak
# memakai koneksi yang sebenarnya sudah mati di sisi server.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1200000}
spring.datasource.hikari.connection-timeout=30000

# Cookie auth wajib Secure (HTTPS-only) di produksi — beda dari default
# profil lain yang mengizinkan HTTP untuk pengembangan lokal.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# Frontend (Vercel) dan backend (Render) berada di domain berbeda, sehingga
# browser memperlakukan setiap panggilan API sebagai lintas-situs. Cookie
# SameSite=Lax akan ditahan pada kondisi itu dan pengguna tampak tidak pernah
# berhasil login. None mengizinkannya, dan hanya sah bila Secure=true di atas.
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
