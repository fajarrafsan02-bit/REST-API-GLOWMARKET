spring.application.name=PROJEK-FAJAR

# server.port=8081

# Profil "local" memuat application-local.properties (tidak ikut ke Git)
# yang berisi kredensial asli untuk komputer ini.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tokweb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Query SQL hanya dicetak di profil dev (lihat application-dev.properties)
spring.jpa.show-sql=false
# Catatan: open-in-view sengaja dibiarkan default (true).
# Mematikannya lebih benar secara arsitektur, tetapi bisa memunculkan
# LazyInitializationException pada endpoint yang memetakan relasi di luar
# transaksi — perlu diuji satu per satu dulu sebelum diubah.

# Struktur database dikelola Flyway (src/main/resources/db/migration),
# bukan lagi ditebak Hibernate. "validate" hanya memeriksa kecocokan entity
# dengan skema saat startup — tidak pernah mengubah tabel sendiri.
spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# FLYWAY (MIGRASI SKEMA)
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Database yang sudah berisi data ditandai berada di versi 1,
# sehingga V1__baseline_schema.sql dilewati dan tidak menimpa apa pun.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================================================
# EMAIL
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.protocol=smtp
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# OTP login admin dikirim sinkron — respons HTTP baru dibalas setelah SMTP
# menerima pesannya. Tanpa batas waktu, SMTP yang menggantung akan menahan
# request login selamanya, jadi ketiga timeout ini wajib ada.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECT_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:15000}

# Dua baris di bawah memotong waktu kirim email dari ~26 detik menjadi ~4 detik.
# Tanpa keduanya, JavaMail memanggil InetAddress.getLocalHost() dua kali —
# sekali untuk nama host di perintah EHLO, sekali lagi untuk menyusun
# Message-ID/alamat pengirim — dan pada jaringan tanpa reverse-DNS untuk nama
# komputer sendiri, tiap pemanggilan menggantung ~9,5 detik sebelum menyerah.
# Nilai keduanya statis sehingga lookup itu tidak pernah dilakukan.
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.from=${spring.mail.username:}

# ============================================================
# FILE UPLOAD
# ============================================================
file.upload-dir=uploads/products
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# CLOUDINARY
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ============================================================
# XENDIT
# ============================================================
xendit.api-key=${XENDIT_API_KEY:}
xendit.api-url=${XENDIT_API_URL:https://api.xendit.co}
# Callback Verification Token dari dashboard Xendit (Settings > Webhooks).
# Wajib diisi — tanpa ini endpoint webhook menolak semua request.
xendit.callback-token=${XENDIT_CALLBACK_TOKEN:}

# ============================================================
# JWT
# ============================================================
# Minimal 32 karakter. Menggunakan kunci fallback yang konsisten agar sesi user tidak ter-logout saat restart.
jwt.secret=${JWT_SECRET:PROJEK_FAJAR_SECRET_KEY_JWT_2026_TOKWEB_SUPER_SECURE_KEY_32}
# Access JWT pendek (30 menit). Sesi panjang memakai refresh token 30 hari.
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ============================================================
# RAJAONGKIR (KOMERCE)
# ============================================================
# Cek ongkir real-time. Kosong = fitur ini nonaktif otomatis, sistem jatuh ke
# tarif tetap di tabel ongkir tanpa error apa pun ke pembeli.
rajaongkir.api-url=${RAJAONGKIR_API_URL:https://rajaongkir.komerce.id/api/v1}
rajaongkir.api-key=${RAJAONGKIR_API_KEY:}

# ============================================================
# GOOGLE LOGIN (Sign in with Google)
# ============================================================
# OAuth Client ID dari Google Cloud Console (APIs & Services > Credentials).
# Wajib diisi agar verifikasi token Google tidak menolak semua login.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# ============================================================
# COOKIE AUTENTIKASI
# ============================================================
# JWT sekarang dibawa lewat cookie httpOnly, bukan localStorage + header
# Authorization — JavaScript di browser tidak bisa membacanya sama sekali,
# jadi token tidak bisa dicuri lewat XSS. Secure wajib true di produksi
# (HTTPS); profil prod meng-override nilai default di bawah ini ke true.
app.auth.cookie-name=${AUTH_COOKIE_NAME:auth_token}
app.auth.refresh-cookie-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ============================================================
# CORS
# ============================================================
# Origin frontend yang diizinkan (pisahkan dengan koma untuk beberapa origin).
# Dulu di-hardcode di 17 controller sekaligus.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# URL dasar frontend, dipakai backend untuk menyusun redirect (mis. Xendit
# success/failure redirect setelah pembayaran selesai di halaman Xendit).
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ============================================================
# SWAGGER / OPENAPI
# ============================================================
# Default: dimatikan dan tidak bisa diakses tanpa login.
# Profil dev yang membukanya (application-dev.properties).
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
app.swagger.public=${SWAGGER_PUBLIC:false}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
springdoc.default-flat-param-object=true
springdoc.override-with-generic-response=false
springdoc.model-and-view-allowed=true

# ============================================================
# RATE LIMIT LOGIN / OTP
# ============================================================
app.rate-limit.auth.max-attempts=${AUTH_MAX_ATTEMPTS:10}
app.rate-limit.auth.window-seconds=${AUTH_WINDOW_SECONDS:60}

# Ambang durasi (ms) agar LoggingAspect menandai pemanggilan lambat.
app.logging.slow-call-ms=${LOG_SLOW_CALL_MS:1000}

