# ============================================================
# PROFIL PROD
# Aktifkan dengan: SPRING_PROFILES_ACTIVE=prod
# Seluruh kredensial diambil dari environment variable.
# ============================================================

spring.jpa.show-sql=false

# Swagger tertutup sepenuhnya di produksi
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
app.swagger.public=false

logging.level.root=WARN
logging.level.org.springdoc=WARN
logging.level.com.projekfajar=INFO
# Produksi menulis ke berkas dengan rotasi supaya jejak error tidak hilang
# begitu proses di-restart, dan tidak menghabiskan disk.
logging.file.name=${LOG_FILE:logs/projek-fajar.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
# Ambang "SLOW" dinaikkan di produksi supaya tidak bising oleh lonjakan wajar.
app.logging.slow-call-ms=${LOG_SLOW_CALL_MS:2000}

# Migrasi tetap dijalankan, tetapi tidak boleh membuat baseline sendiri:
# database produksi harus sudah tercatat versinya secara sadar.
spring.flyway.baseline-on-migrate=false

# Cookie auth wajib Secure (HTTPS-only) di produksi — beda dari default
# profil lain yang mengizinkan HTTP untuk pengembangan lokal.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
