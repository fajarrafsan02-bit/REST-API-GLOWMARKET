# ============================================================
# PROFIL DEV — hanya untuk pengembangan di komputer sendiri.
# Aktifkan dengan: SPRING_PROFILES_ACTIVE=local,dev
# ============================================================

# Tampilkan query SQL saat menelusuri masalah
spring.jpa.show-sql=true

# Swagger terbuka tanpa login supaya mudah mencoba endpoint
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
app.swagger.public=true

# Log lebih detail
logging.level.org.springdoc=DEBUG
logging.level.com.projekfajar=DEBUG
# LoggingAspect mencetak durasi setiap pemanggilan service/controller saat
# level debug aktif, jadi ambang "SLOW" dibuat rendah untuk menelusuri
# endpoint yang berat.
app.logging.slow-call-ms=${LOG_SLOW_CALL_MS:500}
